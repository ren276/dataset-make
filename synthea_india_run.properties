# Synthea run config for India vitals generation
# Used by step1_generate.py via -c flag
# These settings suppress care pathway/billing/geography output we discard

# Output only the CSV files we need (observations + patients)
exporter.csv.export = true
exporter.fhir.export = false
exporter.fhir.r4.export = false
exporter.fhir.stu3.export = false
exporter.fhir.dstu2.export = false
exporter.ccda.export = false
exporter.text.export = false
exporter.html.export = false
exporter.symptoms.csv.export = false
exporter.clinical_note.export = false

# Output directory (resolved relative to synthea project root)
exporter.baseDirectory = ../output_india

# Suppress console noise
synthea.log.level = warn

# Disable modules that are irrelevant for vitals-only extraction
# (care pathways, billing, payers are all discarded in step2)
generate.payers.insurance_companies.default_file = generic/payers/insurance_companies.csv
